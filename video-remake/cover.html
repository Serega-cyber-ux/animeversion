<script>
window.ready=(async()=>{const fs=[];for(const f of['Unbounded','Rubik','Caveat'])for(const w of[700,800,900])fs.push(document.fonts.load(`${w} 40px ${f}`,'АБВ GTA $1'));await Promise.all(fs);await document.fonts.ready;return true})();
function chip(x,y,w,label,val,bg,fg){return `<g transform="translate(${x},${y})"><rect x="5" y="7" width="${w}" height="84" rx="18" fill="${C.ink}"/><rect width="${w}" height="84" rx="18" fill="${bg}" stroke="${C.ink}" stroke-width="4"/>
 <text x="20" y="24" dy="0.36em" font-family="Rubik" font-weight="800" font-size="16" letter-spacing="1.5" fill="${fg}" opacity=".85">${label}</text>
 <text x="20" y="57" dy="0.36em" font-family="Unbounded" font-weight="900" font-size="32" fill="${fg}">${val}</text></g>`}
function cover(){
  const g=uid('cg');
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">`;
  s+=`<defs><radialGradient id="${g}" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#4a2a8f"/><stop offset=".6" stop-color="#22134a"/><stop offset="1" stop-color="#0d0820"/></radialGradient></defs><rect width="720" height="1280" fill="url(#${g})"/>`;
  // sunburst rays
  for(let i=0;i<18;i++){const a=i*20*Math.PI/180;s+=`<path d="M360 610 L${360+1400*Math.cos(a-.09)} ${610+1400*Math.sin(a-.09)} L${360+1400*Math.cos(a+.09)} ${610+1400*Math.sin(a+.09)}Z" fill="#ffd23f" opacity=".06"/>`}
  // left: office / boss (past)
  s+=`<g opacity=".95"><g transform="translate(140,600) rotate(-8)"><rect x="-100" y="-120" width="200" height="230" rx="16" fill="#2a2440" stroke="${C.ink}" stroke-width="5"/>${head({x:0,y:-10,r:62,kind:'boss',e:{eyes:'wide',brow:'down',mouth:'frown',sweat:true}})}
   <rect x="-100" y="70" width="200" height="40" rx="0" fill="${C.red}" stroke="${C.ink}" stroke-width="4"/><text y="90" dy="0.36em" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="20" fill="#fff">ОФИС</text>
   <path d="M-110 -130 L110 120 M110 -130 L-110 120" stroke="${C.red}" stroke-width="14" stroke-linecap="round" opacity=".9"/></g></g>`;
  // right: TV + consoles (future)
  s+=`<g transform="translate(592,600) rotate(6)"><rect x="-14" y="60" width="28" height="32" fill="#2b2833" stroke="${C.ink}" stroke-width="4"/><rect x="-130" y="90" width="260" height="26" rx="8" fill="#8a5a36" stroke="${C.ink}" stroke-width="4"/><rect x="-110" y="-80" width="220" height="140" rx="12" fill="#1d1b24" stroke="${C.ink}" stroke-width="6"/>
   <rect x="-98" y="-68" width="196" height="116" fill="#ff8a3d"/><rect x="-98" y="-68" width="196" height="58" fill="#ff5f8f"/><circle cx="40" cy="-14" r="26" fill="#ffd166"/>
   <text y="22" dy="0.36em" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="34" fill="#fff" stroke="${C.ink}" stroke-width="5" paint-order="stroke">GTA 6</text>
   ${consoleBox(-72,81,.24,90)}${consoleBox(72,81,.24,90)}</g>`;
  // hero
  s+=`<clipPath id="hcl"><rect width="720" height="990"/></clipPath><g clip-path="url(#hcl)">`+person({x:360,y:760,r:118,kind:'hero',pose:'up',e:{eyes:'happy',brow:'up',mouth:'grin',open:1,blush:true}})+`</g>`;
  s+=gamepad(360+.76*118+.25*118+10, 760-1.6*118-48, .95, -14, '#f2f2f6');
  s+=burst(1,0,500,500,C.yel,10,70,120);
  // top title
  s+=`<g transform="translate(360,96)"><rect x="-150" y="-26" width="300" height="52" rx="26" fill="${C.yel}" stroke="${C.ink}" stroke-width="4"/><text dy="0.36em" text-anchor="middle" font-family="Rubik" font-weight="900" font-size="22" letter-spacing="2" fill="${C.ink}">СЕРИЯ 1 · ГЕЙМ-КЛУБ</text></g>`;
  s+=T('УВОЛИЛСЯ',{x:360,y:186,size:72,rot:-3});
  s+=T([{t:'РАДИ ',c:'#fff'},{t:'GTA 6',c:C.yel}],{x:360,y:276,size:70,rot:-3});
  // HUD row
  s+=`<g transform="translate(360,500)">`+chip(-336,-150,200,'СВОИХ','$785',C.red,'#fff')+chip(-120,-150,210,'ДОЛГ ТЁМЕ','$1000','#fff',C.ink)+timerCard(3,{x:106,y:-150,sc:.58})+`</g>`;
  // synopsis
  s+=`<g transform="translate(36,968)"><rect x="6" y="8" width="648" height="196" rx="22" fill="${C.ink}"/><rect width="648" height="196" rx="22" fill="#fff" stroke="${C.ink}" stroke-width="5"/>
   <rect x="22" y="-18" width="200" height="38" rx="10" fill="${C.yel}" stroke="${C.ink}" stroke-width="4"/><text x="122" y="1" dy="0.36em" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="18" fill="${C.ink}">О ЧЁМ СЕРИЯ</text>
   ${['Ушёл из офиса, занял $1000 у друга','и в бабушкиной квартире открыл клуб','с PS5. До релиза — 3 дня. Окупится?'].map((l,i)=>`<text x="30" y="${64+i*44}" dy="0.36em" font-family="Rubik" font-weight="800" font-size="29" fill="${C.ink}">${l}</text>`).join('')}</g>`;
  // CTA
  s+=`<g transform="translate(360,1222) rotate(-2)"><rect x="-266" y="-34" width="532" height="68" rx="18" fill="${C.yel}" stroke="${C.ink}" stroke-width="5"/>
   <text dy="0.36em" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="25" fill="${C.ink}">ТЫ ВЫБИРАЕШЬ: А, Б ИЛИ В</text></g>`;
  return s+vignette(.3)+`</svg>`;
}
window.draw=()=>{document.getElementById('root').innerHTML=cover()};
</script></body></html>
